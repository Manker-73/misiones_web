<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WCA Speedcubing Analyzer</title>
</head>
<body>
  <header>
    <h1>WCA Top Analizador (3x3)</h1>
  </header>

  <section class="controles-panel">
    <div>
      <label for="select-pais"><strong>Filtrar por País:</strong></label>
      <select id="select-pais"></select>
    </div>

    <div>
      <label for="input-top"><strong>Mostrar Top:</strong></label>
      <input type="number" id="input-top" value="50" min="1" max="1000" class="input-top-number" />
    </div>

    <button id="btn-cargar">Analizar Récords</button>
  </section>

  <main id="app">
    <p>Haz clic en el botón para cargar los datos de la WCA.</p>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
